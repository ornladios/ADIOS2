# Fork-only Kotoba header checks. Path-filtered to kotoba/** so this
# workflow is the one that runs for this tree. reuse.yml, pypackaging.yml,
# and everything.yml (git_checks) path-ignore the same kotoba paths so a
# kotoba-only PR does not enqueue those jobs.

name: Kotoba v1

on:
  push:
    paths:
      - "kotoba/**"
      - ".github/workflows/kotoba.yml"
  pull_request:
    paths:
      - "kotoba/**"
      - ".github/workflows/kotoba.yml"

permissions:
  contents: read

jobs:
  checks:
    name: Header and magic fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Kotoba v1 checks
        run: bash kotoba/checks.sh
