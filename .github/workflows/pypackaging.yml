name: Python Packaging

on:
  workflow_dispatch:
    inputs:
      overrideVersion:
        description: Manually force a version
      pypiServer:
        description: Server to publish the pip package
        required: true
        default: 'testpypi'
        type: choice
        options:
          - 'testpypi'
          - 'pypi'

  pull_request:
  push:
    branches:
      - master
      - release_[0-9]+
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ADIOS2_CUSTOM_VERSION_OVERRIDE: ${{ github.event.inputs.overrideVersion }}

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Generate common version file
        run: cmake -P scripts/ci/gh-actions/config/adios-version.cmake && echo VERSION.TXT

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifact_sdist
          path: dist/*.tar.gz

  build_wheels_linux:
    name: Wheels Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Generate common version file
        run: cmake -P scripts/ci/gh-actions/config/adios-version.cmake && echo VERSION.TXT
      - name: Build wheels (abi3 only on pull requests)
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BEFORE_ALL: yum install -y libcurl-devel openssl-devel libsodium-devel
          # cp312 is the abi3 wheel (valid for all CPython >= 3.12), cp314t is
          # free-threaded; both are enabled via pyproject.toml overrides.
          CIBW_BUILD: >-
            ${{ github.event_name == 'pull_request'
              && format('cp312-manylinux_{0}', matrix.arch)
              || format('cp39-manylinux_{0} cp310-manylinux_{0} cp311-manylinux_{0} cp312-manylinux_{0} cp314t-manylinux_{0}', matrix.arch) }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifact_wheels_linux_${{ matrix.arch }}
          path: wheelhouse/*.whl

  build_wheels_macos:
    name: Wheels macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: '14.0'
          - os: macos-15-intel
            arch: x86_64
            target: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Generate common version file
        run: cmake -P scripts/ci/gh-actions/config/adios-version.cmake && echo VERSION.TXT
      - name: Build wheels (abi3 only on pull requests)
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BEFORE_ALL: brew install openssl libsodium
          CIBW_BUILD: >-
            ${{ github.event_name == 'pull_request'
              && format('cp312-macosx_{0}', matrix.arch)
              || format('cp39-macosx_{0} cp310-macosx_{0} cp311-macosx_{0} cp312-macosx_{0} cp314t-macosx_{0}', matrix.arch) }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifact_wheels_macos_${{ matrix.arch }}
          path: wheelhouse/*.whl

  test_wheels:
    name: Test wheel on ubuntu
    needs: [build_wheels_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifact_wheels_*
          path: dist
          merge-multiple: true
      - run: python -m pip install --find-links=dist adios2
      - run: python -c "import adios2"

  test_wheels_macos:
    name: Test wheel on macOS ${{ matrix.arch }}
    needs: [build_wheels_macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: artifact_wheels_macos_${{ matrix.arch }}
          path: dist
      - run: python -m pip install --find-links=dist adios2
      - run: python -c "import adios2"

  test_sdist:
    name: Test SDist on ${{ matrix.os }}
    needs: make_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: artifact_sdist
          path: dist
      - run: python -m pip install -vvv dist/*.tar.gz
        shell: bash
      - run: python -c "import adios2"
        shell: bash

  upload_pypi:
    needs: [build_wheels_linux, build_wheels_macos, make_sdist]
    environment: pypi
    permissions:
      contents: read
      actions: read  # for download-artifact
      id-token: write
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.pypiServer == 'pypi' ||
      (
        github.event_name == 'release' &&
        github.event.action == 'published'
      )
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1

  upload_test_pypi:
    needs: [build_wheels_linux, build_wheels_macos, make_sdist]
    environment: testpypi
    permissions:
      contents: read
      actions: read  # for download-artifact
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pypiServer == 'testpypi'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
        with:
          repository-url: https://test.pypi.org/legacy/
