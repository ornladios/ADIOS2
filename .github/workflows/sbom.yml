name: SBOM

# Immutable releases lock their assets on publish, so the SBOM is attached to
# a draft release when the tag is pushed. A maintainer then publishes the draft.
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SPDX SBOM
        run: pipx run reuse spdx -o adios2-sbom.spdx

      - name: Upload SBOM to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Tags with a suffix (e.g. v2.9.0-rc1) are release candidates
            PRERELEASE=()
            [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --generate-notes "${PRERELEASE[@]}"
          fi
          gh release upload "$TAG" adios2-sbom.spdx --clobber
