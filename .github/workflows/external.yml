name: external
on:
  push:
  pull_request_target:

permissions:
  contents: read

jobs:
  generate_statuses:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: Kitware/cdash-status@ce4d2626d91a2688403b80f123061074314e9b82 # release
        with:
          project: ADIOS
