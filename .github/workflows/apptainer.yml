name: Apptainer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apptainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # for upload-artifact
      packages: write  # for pushing to GHCR
    strategy:
      fail-fast: false
      matrix:
        baseos: [ubuntu-bionic]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ci-source
      - uses: eWaterCycle/setup-apptainer@95b5c781df5f72fd2271cc3cff06904a09d2a087 # v3.0.0
        with:
          apptainer-version: 1.3.6
      - name: Build image
        run: |
            target_arch="$(echo '${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')"
            target_branch="${GITHUB_REF##refs/heads/}"
            echo "image_name=ghcr.io/ornladios/adios2-apptainer-sif-${target_branch}-${target_arch}" >> "$GITHUB_ENV"
            echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
            apptainer build --fakeroot \
                adios2-ci.sif \
                ci-source/scripts/ci/images/spack/Apptainer.def
            ls -lah adios2-ci.sif
      - name: Smoke test
        run: apptainer exec adios2-ci.sif bpls --help
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          retention-days: 1
          name: ci-apptainer ${{ matrix.baseos }} ${{ github.sha }}
          path: adios2-ci.sif
      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
            apptainer remote login \
                --username="${{ github.actor }}" \
                --password="${{ secrets.GITHUB_TOKEN }}" \
                oras://ghcr.io
            apptainer push \
                adios2-ci.sif \
                "oras://${image_name}:${timestamp}"
            apptainer push \
                adios2-ci.sif \
                "oras://${image_name}:latest"
